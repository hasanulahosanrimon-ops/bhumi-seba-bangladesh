
name: Build Bhumi Seba Bangladesh APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          unzip "$ZIP_FILE" -d android-project

      - name: Build APK
        run: |
          cd android-project
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Bhumi-Seba-Bangladesh-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
